# Optional, non-required weekly full-history audit. Use this only in a
# repo that has a committed .privacy-baseline for accepted historical
# exposure. Copy to .github/workflows/privacy-guard-history-audit.yml.
# Do not add "Privacy Guard history audit" as a required status check.
# The required Privacy Guard job still covers new commits; this job
# reports remaining historical findings until a rewrite is authorised.
#
# This file contains no personal data and no account-specific addresses.

name: Privacy Guard history audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-guard-history-audit:
    name: Privacy Guard history audit
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan history for secrets
        run: gitleaks detect --source . --log-opts=--all --redact --no-banner --exit-code 1
      - name: Check commit emails and trailers over full history
        run: bash scripts/check-commit-emails.sh --all
